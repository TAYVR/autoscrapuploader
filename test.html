<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Watch Test — Verified</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1117; color: #e6e6e6; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #f0a500; }
  h2 { color: #fff; margin: 30px 0 10px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card { background: #1a1d27; border-radius: 10px; padding: 10px; }
  .card .host { font-weight: bold; margin-bottom: 6px; }
  .ok { color: #4caf50; }
  .bad { color: #f44336; }
  iframe { width: 100%; height: 200px; border: none; border-radius: 6px; background: #000; }
  a { color: #7db8ff; word-break: break-all; font-size: 12px; }
  .note { background: #2a2000; border: 1px solid #f0a500; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-left: 6px; }
  .tag-ok { background: #14532d; color: #86efac; }
  .tag-bad { background: #7f1d1d; color: #fca5a5; }
</style>
</head>
<body>
<h1>Movie Watch Links — Verified Test</h1>
<p class="note">تم التحقق من API المضيفات (canplay / file_length) يوم 2026-08-07.
<span class="tag tag-ok">يعمل</span> = مؤكد يعمل (canplay:1). <span class="tag tag-bad">معطوب</span> = canplay:0 / 404 — يحتاج إعادة رفع بالـ pipeline الجديد (ffmpeg).</p>

<div id="movies"></div>

<script>
const movies = [
  {
    title: "The Currents 2025",
    note: "حالة الرفع الحالية لكل مضيف (تحقق API):",
    hosts: [
      ["streamwish", "https://streamwish.to/embed-js0tjlmm1v2j.html", "ok", "full 637MB canplay:1"],
      ["streamwish (clip test)", "https://streamwish.to/embed-10gbx1ybk38m.html", "ok", "عيّنة 20s من الـ pipeline الجديد canplay:1"],
      ["streamwish (old)", "https://streamwish.to/embed-ilmnr116dnv1.html", "bad", "canplay undefined — 404"],
      ["earnvids (old)", "https://earnvids.com/embed-7hpeikyzsv63.html", "bad", "canplay:0"],
      ["uqload (old)", "https://uqload.is/embed-cxtd78qm53a1.html", "bad", "canplay:0"],
      ["vinovo (old)", "https://vinovo.si/e/q7k3kk3qan9oke", "bad", "canplay:0 (API قديم)"],
      ["mixdrop (old)", "https://mixdrop.ag/e/eln6nn0efqxvkxk", "bad", "API 404"],
      ["clicknupload (old)", "https://clicknupload.click/embed-8k7naumfvqti.html", "bad", "ملف 668MB موجود لكن بدون تحقق تشغيل"]
    ]
  }
];

const root = document.getElementById('movies');
for (const m of movies) {
  const h = document.createElement('div');
  h.innerHTML = '<h2>' + m.title + ' <span style="font-size:13px;color:#aaa">— ' + m.note + '</span></h2>';
  const grid = document.createElement('div');
  grid.className = 'grid';
  for (const [host, url, status, desc] of m.hosts) {
    const card = document.createElement('div');
    card.className = 'card';
    const badge = status === 'ok'
      ? '<span class="tag tag-ok">يعمل</span>'
      : '<span class="tag tag-bad">معطوب</span>';
    card.innerHTML = '<div class="host ' + (status === 'ok' ? 'ok' : 'bad') + '">' + host + ' ' + badge + '</div>'
      + '<iframe src="' + url + '" loading="lazy" allowfullscreen></iframe>'
      + '<div style="font-size:12px;color:#aaa;margin:4px 0">' + desc + '</div>'
      + '<div><a href="' + url + '" target="_blank">' + url + '</a></div>';
    grid.appendChild(card);
  }
  h.appendChild(grid);
  root.appendChild(h);
}
</script>
</body>
</html>
