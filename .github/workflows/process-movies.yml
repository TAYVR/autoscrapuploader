name: Automated Movie Scraper Pipeline

on:
  schedule:
    # Runs 10 times a day spaced out
    - cron: '0 2,4,7,9,11,14,16,18,20,22 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of movies to process in this run'
        required: false
        default: '1'
      force_reencode:
        description: 'Force full re-encode (1) or copy-when-compatible (0)'
        required: false
        default: '0'
      ffmpeg_preset:
        description: 'libx264 preset (ultrafast/fast/medium/slow)'
        required: false
        default: 'fast'

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (FFmpeg & Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6 lsb-release wget xdg-utils

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Movie Scraper Script
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '1' }}
          FORCE_REENCODE: ${{ github.event.inputs.force_reencode || '0' }}
          FFMPEG_PRESET: ${{ github.event.inputs.ffmpeg_preset || 'fast' }}
          TARGET_BASE_URL: 'https://topcinemaa.co/'
        run: node script.js

      - name: Commit and Push Updated State
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update state.json [skip ci]"
          file_pattern: "state.json result.json"
